[project]
name = "flet-health-connect"
version = "0.1.0"
description = "Native Google Health Connect bridge for Flet"
requires-python = ">=3.12"
dependencies = [
    "flet==1.1.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"flutter.health_connect" = ["**/*"]
